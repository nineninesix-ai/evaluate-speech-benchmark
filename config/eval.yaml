# =============================================================================
#  speecheval — evaluation configuration
#
#  Protocol: Multilingual Speech Benchmark v2.0 (benchmark/README.md).
#  Every parameter that determines a published number lives in this file.
#  Nothing is hardcoded in the package; changing a number means changing a line
#  here, and the value used is written into every report.
# =============================================================================

run:
  name: gepard-1.2-grpo             # system under test — appears in every table
  output_dir: results/gepard-1.2-grpo    # reports land here, mirroring benchmark/reports
  cache_dir: .cache/speecheval      # per-stage cache; makes every stage resumable
  device: auto                      # auto | cuda | cpu
  seed: 20260725                    # same seed the benchmark used for its bootstraps
  resume: true                      # reuse cached stage output instead of recomputing


# --- reference side -----------------------------------------------------------
# The benchmark itself: target texts, prompt audio, and the human anchors.
benchmark:
  path: ../gepard-inference/bm_dataset   # local snapshot (or a HF repo id)
  split: main
  languages: [en-US, es-MX, nl-NL, pt-BR] # only these four were generated this run
  reports_dir: ../gepard-inference/bm_dataset/reports  # anchor / impostor-floor coefficients


# --- system side --------------------------------------------------------------
# Synthesised audio. The generator writes a nested tree: one directory per
# language, holding one "<voice>.parquet" per reference voice. Each voice must
# resolve in `voices` below. (The original flat "<language>__<voice>/" layout is
# still accepted; either produces subsets named "<language>__<voice>".)
synthesis:
  path: grpo-bm-dataset/data
  split: train
  include: null                     # null = every subset found; or a list of "<lang>__<voice>"
  exclude: []
  columns:
    key: utt                        # join key against the benchmark
    audio: audio
    text: text
    duration: audio_seconds         # duration of the generated clip (was gen_dur)
    latency: gen_seconds            # wall-clock generation time (was latency_s)
    model: checkpoint               # system identity (was model_id)
    voice: voice                    # reference-voice name (was ref_voice)


# --- what each reference voice is ---------------------------------------------
# per_row    — the voice is cloned from this row's own benchmark prompt. The
#              benchmark's published anchor and impostor floor apply directly.
# fixed_file — one voice for the whole subset, from a local file. The benchmark's
#              coefficients do NOT apply; speecheval calibrates its own floor and
#              anchor for it (see sim.calibration.fixed_file_voices).
# Every voice this run used is a platform preset — a single reference clip reused
# across the whole subset — so all are `fixed_file`: speecheval computes their own
# impostor floor and (optimistic, intra-session) anchor. The platform reference
